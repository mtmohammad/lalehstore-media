<!doctype html><html dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:V;src:url(/home/claude/lalehstore-media/tools/fonts/Vazirmatn-Black.ttf);font-weight:900}

:root{--cy:#6FE6F0;--red:#FF3B4E}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1350px;overflow:hidden;position:relative;font-family:V;color:#fff;
background:radial-gradient(ellipse at 15% 22%,rgba(255,40,60,.55),transparent 32%),radial-gradient(ellipse at 92% 30%,rgba(255,50,70,.45),transparent 28%),radial-gradient(ellipse at 55% 8%,rgba(200,20,40,.35),transparent 30%),radial-gradient(ellipse at 50% 75%,#2a1416,transparent 70%),#0d0a0c}
.bokeh{position:absolute;border-radius:50%;filter:blur(18px);background:rgba(255,60,75,.5)}
.floor{position:absolute;left:-30%;right:-30%;bottom:-40px;height:560px;transform:perspective(600px) rotateX(64deg);transform-origin:bottom;
background-image:linear-gradient(rgba(220,220,235,.28) 2px,transparent 2px),linear-gradient(90deg,rgba(220,220,235,.28) 2px,transparent 2px);background-size:90px 90px;
-webkit-mask-image:linear-gradient(to top,#000 30%,transparent 95%)}
.ring{position:absolute;left:50%;border-radius:50%;transform:translateX(-50%)}
.title{position:absolute;right:70px;top:70px;text-align:right}
.title h1{font-weight:900;font-size:62px;line-height:1.2;text-shadow:0 4px 24px rgba(0,0,0,.6)}
.title h2{font-weight:500;font-size:30px;color:#e9dfe2;margin-top:6px}
.lat{direction:ltr;unicode-bidi:isolate}
.hud{position:absolute;top:300px;right:70px;left:70px;height:120px}
.box{font-family:M;font-size:44px;color:var(--cy);padding:6px 22px;text-shadow:0 0 14px rgba(111,230,240,.8);direction:ltr}
.box:before,.box:after{content:"";position:absolute;top:0;bottom:0;width:14px;border:3px solid rgba(111,230,240,.85)}
.box:before{left:0;border-right:none}.box:after{right:0;border-left:none}
.redbar{border-radius:30px;background:rgba(255,40,60,.75);filter:blur(10px)}
.redlbl{font-weight:900;font-size:30px;color:#fff;text-shadow:0 0 10px #ff2040}
svg{position:absolute;overflow:visible}
.glowc{filter:drop-shadow(0 0 8px rgba(111,230,240,.9))}
.lbl{position:absolute;font-family:M;font-size:26px;color:var(--cy);text-shadow:0 0 10px rgba(111,230,240,.8);direction:ltr;transform:translateX(-50%) skewY(3deg);white-space:nowrap}
.sub{position:absolute;font-weight:700;font-size:20px;color:#d9eef0;transform:translateX(-50%);white-space:nowrap;opacity:.9}
.amp{position:absolute;left:190px;top:850px;width:700px;filter:drop-shadow(0 0 40px rgba(255,50,70,.45)) drop-shadow(0 40px 40px rgba(0,0,0,.8));transform:rotate(-3deg)}
.chips{position:absolute;right:40px;top:1196px;left:40px;display:flex;gap:14px;justify-content:center}
.chip{border:2px solid rgba(111,230,240,.7);border-radius:30px;padding:7px 16px;font-weight:700;font-size:21px;color:#e8fbfd;background:rgba(8,22,26,.9);box-shadow:0 0 16px rgba(111,230,240,.25);white-space:nowrap}
.chip b{font-family:M;font-weight:400;font-size:20px;color:var(--cy)}
.foot{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:16px;background:#fff;border-radius:46px;padding:8px 10px 8px 24px;box-shadow:0 10px 30px rgba(0,0,0,.5);white-space:nowrap}
.foot img{height:36px}.cta{background:linear-gradient(90deg,#FF3B4E,#c3122b);color:#fff;font-weight:900;font-size:21px;border-radius:30px;padding:7px 20px}
